<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر Dream Football</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a url('https://i.imgur.com/your_dragon_image_url.jpg') no-repeat center center fixed; /* استبدل الرابط بصورة التنين اللي عندك لو حبيت */
            background-size: cover;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .overlay {
            background: rgba(0, 0, 0, 0.85);
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 50px;
        }
        header {
            width: 100%;
            padding: 15px 30px;
            background: rgba(20, 20, 20, 0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            border-bottom: 2px solid #ff4500;
        }
        header h1 { margin: 0; color: #ff4500; text-shadow: 0 0 10px #ff4500; }
        .user-info { font-weight: bold; color: #ddd; }
        
        .container { width: 90%; max-width: 1000px; margin-top: 30px; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: linear-gradient(145deg, #1a1a1a, #2a2a2a);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255, 69, 0, 0.3);
            border-color: #ff4500;
        }
        .card h3 { color: #ffa500; margin-top: 0; }
        .card p { color: #ccc; font-size: 14px; }
        .price { font-size: 20px; font-weight: bold; color: #4CAF50; margin: 15px 0; }
        
        button {
            background: #ff4500;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover { background: #cc3700; }
        button:disabled { background: #555; cursor: not-allowed; }

        /* Admin Section Styles */
        #admin-section { display: none; width: 90%; max-width: 800px; margin-top: 30px; }
        .login-box {
            background: #1a1a1a; padding: 20px; border-radius: 10px; border: 1px solid #333; text-align: center;
        }
        .login-box input { width: 80%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #444; background: #000; color: #fff; }
        .request-item {
            background: #222; padding: 15px; margin-bottom: 10px; border-radius: 8px; border-right: 4px solid #ffa500;
            display: flex; justify-content: space-between; align-items: center;
        }
        .request-info { text-align: right; }
        .request-info strong { color: #ff4500; }
        .btn-approve { width: auto; background: #4CAF50; padding: 8px 15px; }
        .btn-approve:hover { background: #45a049; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="overlay">
    <header>
        <h1>DREAM STORE</h1>
        <div class="user-info" id="user-status">جاري التحقق...</div>
        <button id="admin-toggle" style="width:auto; padding: 5px 15px; background: #333;">دخول الإدارة</button>
    </header>

    <!-- User Store Section -->
    <div class="container" id="store-section">
        <h2 style="text-align: center; color: #ddd;">الباقات المتاحة</h2>
        <div class="grid" id="products-grid">
            <!-- Products will be rendered here -->
        </div>
    </div>

    <!-- Admin Section -->
    <div id="admin-section">
        <!-- Admin Login -->
        <div class="login-box" id="admin-login-box">
            <h2>لوحة تحكم الإدارة (GG)</h2>
            <input type="text" id="admin-user" placeholder="اسم المستخدم">
            <input type="password" id="admin-pass" placeholder="كلمة المرور">
            <button onclick="loginAdmin()">تسجيل الدخول</button>
            <p id="login-error" style="color: red; display: none;">بيانات غير صحيحة</p>
        </div>

        <!-- Admin Dashboard -->
        <div id="admin-dashboard" class="hidden">
            <h2 style="color: #ff4500;">طلبات الشحن المعلقة</h2>
            <div id="requests-list">
                <!-- Requests will render here -->
            </div>
            <button onclick="logoutAdmin()" style="background: #d32f2f; margin-top: 20px;">تسجيل خروج الإدارة</button>
        </div>
    </div>
</div>

<!-- Firebase Modules -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getDatabase, ref, push, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    // إعدادات Firebase الخاصة بك
    const firebaseConfig = {
        apiKey: "AIzaSyATXRfYw9T7TxxEyMWbTRyfL6s8Op15r_w",
        authDomain: "myfootdream-9f0cc.firebaseapp.com",
        databaseURL: "https://myfootdream-9f0cc-default-rtdb.firebaseio.com",
        projectId: "myfootdream-9f0cc",
        storageBucket: "myfootdream-9f0cc.firebasestorage.app",
        messagingSenderId: "318264642937",
        appId: "1:318264642937:web:c1c99a49ff58a6ca49b3a8",
        measurementId: "G-HWME6JNCXM"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // متغيرات الحالة
    let currentUser = null;
    let isAdmin = false;

    // المنتجات (ممكن لاحقاً تجيبها من الداتا بيز)
    const products = [
        { id: 'p1', name: '1000 كوينز', type: 'coins', amount: 1000, price: '10 جنيه' },
        { id: 'p2', name: '5000 كوينز', type: 'coins', amount: 5000, price: '45 جنيه' },
        { id: 'p3', name: '1000 DFK', type: 'dfk', amount: 1000, price: '50 جنيه' },
        { id: 'p4', name: 'باقة لاعبين أسطورية', type: 'player_pack', amount: 1, price: '100 جنيه' }
    ];

    // عناصر DOM
    const userStatus = document.getElementById('user-status');
    const productsGrid = document.getElementById('products-grid');
    const adminToggleBtn = document.getElementById('admin-toggle');
    const storeSection = document.getElementById('store-section');
    const adminSection = document.getElementById('admin-section');
    const adminLoginBox = document.getElementById('admin-login-box');
    const adminDashboard = document.getElementById('admin-dashboard');

    // التحقق من حالة تسجيل الدخول (يفترض أن اللعبة سجلت الدخول مسبقاً)
    // ملاحظة: لو المستخدم دخل المتجر من رابط خارجي ومش مسجل، لازم يتسجل الأول
    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            userStatus.textContent = `متصل: ${user.email}`;
            renderProducts();
        } else {
            userStatus.textContent = 'يرجى تسجيل الدخول من اللعبة أولاً';
            userStatus.style.color = 'red';
        }
    });

    // رسم المنتجات
    function renderProducts() {
        productsGrid.innerHTML = '';
        products.forEach(prod => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <h3>${prod.name}</h3>
                <p>النوع: ${prod.type}</p>
                <div class="price">${prod.price}</div>
                <button onclick="buyProduct('${prod.name}', '${prod.type}', ${prod.amount})" ${!currentUser ? 'disabled' : ''}>شراء</button>
            `;
            productsGrid.appendChild(card);
        });
    }

    // وظيفة الشراء (تسجيل طلب في الداتا بيز)
    window.buyProduct = (name, type, amount) => {
        if (!currentUser) return alert('يجب تسجيل الدخول أولاً!');
        if (!confirm(`هل أنت متأكد من طلب: ${name}؟`)) return;

        const reqRef = push(ref(db, 'requests'));
        set(reqRef, {
            userId: currentUser.uid,
            itemName: name,
            type: type,
            amount: amount,
            status: 'pending',
            timestamp: Date.now()
        }).then(() => {
            alert('تم إرسال الطلب للإدارة بنجاح. يرجى الانتظار حتى يتم القبول.');
        }).catch(err => alert('خطأ: ' + err.message));
    };

    // --- منطق الإدارة ---
    
    // إظهار شاشة الإدارة
    adminToggleBtn.addEventListener('click', () => {
        storeSection.classList.add('hidden');
        adminSection.style.display = 'block';
    });

    // تسجيل دخول الإدارة (بيانات ثابتة زي ما طلبت)
    window.loginAdmin = () => {
        const u = document.getElementById('admin-user').value;
        const p = document.getElementById('admin-pass').value;

        if (u === 'GG' && p === 'GG11') {
            isAdmin = true;
            adminLoginBox.classList.add('hidden');
            adminDashboard.classList.remove('hidden');
            loadRequests();
        } else {
            document.getElementById('login-error').style.display = 'block';
        }
    };

    // تسجيل خروج الإدارة
    window.logoutAdmin = () => {
        isAdmin = false;
        adminLoginBox.classList.remove('hidden');
        adminDashboard.classList.add('hidden');
        adminSection.style.display = 'none';
        storeSection.classList.remove('hidden');
        document.getElementById('admin-user').value = '';
        document.getElementById('admin-pass').value = '';
    };

    // تحميل الطلبات
    function loadRequests() {
        const reqRef = ref(db, 'requests');
        onValue(reqRef, (snapshot) => {
            const data = snapshot.val();
            const list = document.getElementById('requests-list');
            list.innerHTML = '';

            if (!data) {
                list.innerHTML = '<p>لا توجد طلبات حالياً.</p>';
                return;
            }

            Object.keys(data).forEach(key => {
                const req = data[key];
                if (req.status === 'pending') {
                    const div = document.createElement('div');
                    div.className = 'request-item';
                    div.innerHTML = `
                        <div class="request-info">
                            <strong>${req.itemName}</strong><br>
                            <small>UserID: ${req.userId.substring(0,8)}...</small>
                        </div>
                        <button class="btn-approve" onclick="approveRequest('${key}', '${req.userId}', '${req.type}', ${req.amount}, '${req.itemName}')">قبول وإرسال</button>
                    `;
                    list.appendChild(div);
                }
            });

            if (list.innerHTML === '') {
                list.innerHTML = '<p>لا توجد طلبات معلقة.</p>';
            }
        });
    }

    // قبول الطلب وإرساله لبريد اللاعب
    window.approveRequest = (reqId, userId, type, amount, itemName) => {
        if (!confirm('هل أنت متأكد من قبول الطلب وإرسال المكافأة لبريد اللاعب؟')) return;

        // 1. إرسال المكافأة للبريد
        const mailRef = push(ref(db, `mail/${userId}`));
        set(mailRef, {
            subject: 'تم شحن حسابك',
            content: `تمت إضافة ${itemName} إلى حسابك.`,
            reward: {
                type: type,
                amount: amount
            },
            claimed: false,
            timestamp: Date.now()
        }).then(() => {
            // 2. تغيير حالة الطلب إلى مقبول
            return update(ref(db, `requests/${reqId}`), {
                status: 'approved'
            });
        }).then(() => {
            alert('تم القبول وإرسال المكافأة للبريد بنجاح.');
        }).catch(err => alert('حدث خطأ: ' + err.message));
    };

</script>
</body>
</html>
